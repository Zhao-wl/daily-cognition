<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>每日认知探索</title><style>
:root{--bg:#f7f5ef;--panel:#fffdfa;--text:#24231f;--muted:#6f6a61;--line:#ded8cc;--accent:#275f5b;--accent2:#b56a3a;--soft:#eaf2ef;--shadow:0 12px 36px rgba(42,36,24,.08)}
[data-theme="dark"]{--bg:#151614;--panel:#1d1f1c;--text:#ece9e0;--muted:#aaa69d;--line:#34372f;--accent:#79b6ae;--accent2:#d89569;--soft:#24302c;--shadow:0 14px 40px rgba(0,0,0,.24)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-serif,"Noto Serif SC","Songti SC","STSong",Georgia,serif;line-height:1.82}
.shell{max-width:1180px;margin:auto;padding:0 24px}.topbar{display:flex;justify-content:space-between;align-items:center;padding:22px 0;font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px}.btn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:999px;padding:8px 12px;cursor:pointer}.eyebrow{font-family:ui-sans-serif,system-ui,sans-serif;color:var(--accent);letter-spacing:.12em;font-weight:700;font-size:13px}.intro{font-size:19px;color:var(--muted);max-width:780px}.weekhero{padding:42px 0 24px}.weekhero h1{font-size:clamp(36px,6vw,64px);line-height:1.1;margin:.2em 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.card{border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:22px;text-decoration:none;color:var(--text);transition:.18s transform}.card:hover{transform:translateY(-3px)}.card .date{color:var(--accent);font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px}.card h2{font-size:28px;margin:6px 0}.card p{color:var(--muted);margin:0}.footer{border-top:1px solid var(--line);margin-top:40px;padding:30px 0 60px;color:var(--muted);font-family:ui-sans-serif,system-ui,sans-serif}@media(max-width:700px){.grid{grid-template-columns:1fr}.shell{padding:0 16px}}
</style></head><body><div class="shell"><div class="topbar"><span>每日认知探索</span><button class="btn" id="theme">切换明暗</button></div><header class="weekhero"><div class="eyebrow">PERSONAL KNOWLEDGE ATLAS</div><h1>不是知识卡片，<br>是一座持续生长的认知网站。</h1><p class="intro">每天一个完整长文主题；按年份与自然周归档；每篇根据主题选择时间轴、关系图、结构示意或真正有信息增量的交互。周页面负责连接主题，不用摘要替代正文。</p></header><div class="grid"><a class="card" href="2026/index.html"><div class="date">2026 · 当前年份</div><h2>进入 2026</h2><p>已收录 14 个主题，覆盖复杂系统、思想史、艺术与空间、制度、概率、控制、全球化、物种共演化、行星动力学，以及文献材料与成像科学。</p></a></div><footer class="footer">GitHub is the canonical content source · GitHub Pages is the reading layer</footer></div><script>document.getElementById('theme').addEventListener('click',()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'':'dark'});</script></body></html>
